spring.application.name=ms-edututor-report
server.port=8085

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:edututor_report}
spring.datasource.password=${DB_PASSWORD:EduTutorRep2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------- Kafka
# Este servicio CONSUME dos tópicos, cada uno con su grupo:
#   sessions.events  (grupo report-service-v1)   -> métricas de sesiones
#   sessions.alerts  (grupo report-alerts-v1)    -> alertas que publica audit
# Los nombres de los tópicos son los que declara kafka-admin en su application.yml.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=ms-edututor-report

# --- consumidor
spring.kafka.consumer.group-id=report-service-v1
spring.kafka.consumer.auto-offset-reset=earliest
# El offset se confirma al terminar de procesar cada mensaje, no antes (ack-mode=record).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer envuelve al JsonDeserializer: un mensaje que no es JSON
# no rompe el consumidor, llega al manejador de errores y termina en la DLT.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Tipo por defecto (eventos). El listener de alertas lo cambia con su propio default.type.
spring.kafka.consumer.properties.spring.json.value.default.type=cl.duoc.edututorreport.SessionEventDto
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.edututorreport
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=record
# Un hilo: las métricas son contadores compartidos (ver ReportEventListener).
spring.kafka.listener.concurrency=1

# --- productor (solo para reenviar a la DLT los mensajes que no se pudieron procesar)
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.max.block.ms=5000

# --- tópicos y grupos
edututor.kafka.topic.events=sessions.events
edututor.kafka.topic.alerts=sessions.alerts
edututor.kafka.alerts-group=report-alerts-v1
edututor.kafka.dlt-suffix=.DLT

# --- reintentos antes de enviar a la DLT (espera 1 s, 2 s, 4 s)
edututor.kafka.retry.max-attempts=3
edututor.kafka.retry.initial-interval-ms=1000
edututor.kafka.retry.multiplier=2.0
edututor.kafka.retry.max-interval-ms=8000
